da y cuenta con una barra desayunadora. Además, en esta planta baja hay un baño de servicio junto al living. El gran patio trasero es un oasis de tranquilidad, con pileta, parrilla y una exuberante vegetación. El garage cubierto para dos vehículos puede funcionar como quincho y tiene salida al patio trasero.\nEn la planta alta, la casa cuenta con dos dormitorios con disposición contrafrente, ambos con placares y radiadores; uno de ellos es en suite, con vestidor y su propio antebaño y baño. Otros dos dormitorios, también con placares y radiadores, tienen disposición frente y son muy luminosos. Completa esta planta un baño completo con antebaño de excelente calidad. Toda la propiedad se caracteriza por sus materiales de construcción de alta calidad, excelente mantenimiento y una disposición funcional.\nLa casa mide en su totalidad 253 m2, todos cubiertos, y posee cochera cubierta. Además, cuenta con desagüe cloacal, internet, pavimento, luz, gas natural, agua corriente, cocina, jardín, dormitorio en suite, lavadero, living comedor, patio, vestidor, conexión para lavarropas, permite mascotas, toilette, calefacción, placards, desayunador, comedor, parrilla, living y quincho. Se escuchan ofertas y se ofrece una gran variedad de posibles permutas y/o planes de financiación, haciendo de esta propiedad una oportunidad única.","pu":"De León Propiedades","ph":["https://res.cloudinary.com/drvij1eff/image/upload/c_fill,f_auto,fl_immutable_cache.progressive,g_center,h_900,q_auto,w_1600/v1764560993/7ee7505f-00ef-4d67-8ee0-019d3cbe189c-listing-gallery-80faf921ca9db60429f4?_a=BACCg+Ev","https://res.cloudinary.com/drvij1eff/image/upload/c_limit,f_auto,fl_immutable_cache.progressive,q_auto:good,w_1200/v1764560997/7ee7505f-00ef-4d67-8ee0-019d3cbe189c-listing-gallery-2afe7924d81a83923ea5?_a=BACCg+Ev","https://res.cloudinary.com/drvij1eff/image/upload/c_limit,f_auto,fl_immutable_cache.progressive,q_auto:good,w_1200/v1764560999/7ee7505f-00ef-4d67-8ee0-019d3cbe189c-listing-gallery-10509b
